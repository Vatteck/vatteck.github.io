      <div style="max-width:640px;margin:2.5rem auto;padding:0 1rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#e2e8f0">
        <p><strong>Atlas</strong> is a graphical package manager for Arch Linux that unifies pacman, AUR, Flatpak, and AppImage into a single dashboard — surfacing risk and showing you exactly what a transaction will do before anything touches your system.</p>
        <h2 style="font-size:1rem;margin:1.5rem 0 .5rem">Features</h2>
        <ul>
          <li><strong>One Card, Every Source</strong> — search, install, update, downgrade, and remove software across official Arch repositories, AUR, Flatpak, and AppImage from one interface.</li>
          <li><strong>Transaction Preview &amp; Trust</strong> — review the full install action — packages, versions, and dependency changes — before confirming.</li>
          <li><strong>PKGBUILD Viewer &amp; AUR Safety</strong> — inspect the exact build script and its history before any AUR package is installed; AUR and official packages stay clearly separated.</li>
          <li><strong>Arch Maintenance Cockpit</strong> — updates, cleanup, and system health in one place, with Flatpak transparency and control built in.</li>
        </ul>
