<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080A" />
  <title>ERR 404 — TRACE LOST | VATTECK</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #08080A;
      --card: #0E0E12;
      --border: #222229;
      --copper: #E7A15E;
      --red: #FF2A26;
      --amber: #FBBF24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: #E2E8F0;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
    }
    /* Ghost numeral */
    .ghost {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Archivo', sans-serif;
      font-size: clamp(240px, 44vw, 520px);
      font-weight: 900;
      letter-spacing: -0.05em;
      color: #17171C;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    .content { position: relative; z-index: 1; max-width: 34rem; }
    .record {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #64748B;
    }
    .record .dot {
      width: 7px; height: 7px; border-radius: 9999px;
      background: var(--amber);
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }
    h1 {
      margin-top: 1.25rem;
      font-family: 'Archivo', sans-serif;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
    h1 .err { color: var(--red); }
    p {
      margin-top: 0.875rem;
      font-size: 15px;
      line-height: 1.6;
      color: #94A3B8;
    }
    /* Trace divider: copper route with via end pads */
    .trace { display: block; margin: 2.25rem auto 0; }
    .trace text { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.3em; fill: #475569; }
    .home {
      display: inline-block;
      margin-top: 2.25rem;
      padding: 0.625rem 1.5rem;
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 0.375rem;
      color: #E2E8F0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 150ms ease, color 150ms ease;
    }
    .home:hover { border-color: var(--copper); color: var(--copper); }
    footer {
      padding: 1.25rem 1rem;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #475569;
    }
    @media (prefers-reduced-motion: no-preference) {
      .record .dot { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    }
  </style>
</head>
<body>
  <main>
    <div class="ghost" aria-hidden="true">404</div>
    <div class="content">
      <div class="record">
        <span class="dot" aria-hidden="true"></span>
        ERR 404 · TRACE LOST
      </div>
      <h1>Signal lost on <span class="err">NET: MAIN</span>.</h1>
      <p>The node you requested isn't mounted on this board. The route may have been rerouted, the via lifted, or the address was never populated.</p>
      <svg class="trace" width="300" height="46" viewBox="0 0 300 46" fill="none" aria-hidden="true">
        <path d="M8 15 H150 V30 H292" stroke="#E7A15E" stroke-opacity="0.65" stroke-width="2" />
        <circle cx="8" cy="15" r="5" stroke="rgba(231,161,94,0.4)" stroke-width="1.5" fill="none" />
        <circle cx="8" cy="15" r="2" fill="rgba(231,161,94,0.6)" />
        <circle cx="292" cy="30" r="5" stroke="rgba(231,161,94,0.4)" stroke-width="1.5" fill="none" />
        <circle cx="292" cy="30" r="2" fill="rgba(231,161,94,0.6)" />
        <text x="150" y="44" text-anchor="middle">NO ROUTE</text>
      </svg>
      <a class="home" href="/">← Return to bench</a>
    </div>
  </main>
  <footer>VATTECK-01 · REV C · NET: MAIN</footer>
</body>
</html>
