<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7A15E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E7A15E" stop-opacity="0"/>
    </linearGradient>
    <filter id="ledglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Substrate. -->
  <rect width="1200" height="630" fill="#08080A"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Corner ticks: viewport framing. -->
  <g stroke="#2E2E37" stroke-width="3" fill="none">
    <path d="M40 40H88M40 40V88"/>
    <path d="M1160 40H1112M1160 40V88"/>
    <path d="M40 590H88M40 590V542"/>
    <path d="M1160 590H1112M1160 590V542"/>
  </g>

  <!-- Routed traces: 90-degree copper lines. -->
  <g fill="none" stroke="#E7A15E" stroke-linecap="square">
    <path d="M0 96 H210 V150 H360" stroke-width="4" stroke-opacity="0.55"/>
    <path d="M0 140 H90 V96" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M840 150 H990 V96 H1200" stroke-width="4" stroke-opacity="0.55"/>
    <path d="M1110 140 H1200" stroke-width="2" stroke-opacity="0.35"/>
  </g>

  <!-- Vias. -->
  <g>
    <circle cx="360" cy="150" r="10" fill="none" stroke="#E7A15E" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="360" cy="150" r="4" fill="#E7A15E" fill-opacity="0.9"/>
    <circle cx="840" cy="150" r="10" fill="none" stroke="#E7A15E" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="840" cy="150" r="4" fill="#E7A15E" fill-opacity="0.9"/>
  </g>

  <!-- Silkscreen labels. -->
  <text x="375" y="128" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="17" letter-spacing="5">NET: MAIN</text>
  <text x="872" y="600" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="17" letter-spacing="5">VATTECK-01 · REV C</text>

  <!-- Status readout. -->
  <circle cx="80" cy="112" r="8" fill="#34D399"/>
  <circle cx="80" cy="112" r="8" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="6"/>
  <text x="100" y="119" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="4">OPERATIONAL</text>

  <!-- Ghost numeral. -->
  <text x="1060" y="430" fill="#1E1E26" font-family="'Archivo', sans-serif" font-size="360" font-weight="900" letter-spacing="-18">01</text>

  <!-- Title block. -->
  <text x="80" y="300" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="7">HARDWARE TECHNICIAN · INDEPENDENT DEVELOPER</text>
  <text x="76" y="412" fill="#FFFFFF" font-family="'Archivo', sans-serif" font-size="128" font-weight="800" letter-spacing="-8">VATTECK<tspan fill="#FF2A26">-01</tspan></text>

  <!-- Divider trace. -->
  <path d="M80 450 H260" stroke="#E7A15E" stroke-width="4" stroke-opacity="0.7"/>
  <circle cx="80" cy="450" r="6" fill="none" stroke="#E7A15E" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="80" cy="450" r="2.5" fill="#E7A15E"/>

  <text x="80" y="520" fill="#94A3B8" font-family="'IBM Plex Sans', sans-serif" font-size="30" font-weight="500">Repairing hardware. Building software that ships.</text>
  <text x="80" y="565" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="4">ATLAS · HASH FACTORY · CONTINUITY · LIFEOS</text>
</svg>
