<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Board: near-black substrate, hardware border. -->
  <rect x="24" y="24" width="208" height="208" rx="28" fill="#0E0E12" stroke="#2A2A31" stroke-width="4" />

  <!-- Pin rail: three copper legs on the left edge. -->
  <g fill="#E7A15E" fill-opacity="0.55">
    <rect x="40" y="64" width="12" height="12" rx="2" />
    <rect x="40" y="122" width="12" height="12" rx="2" />
    <rect x="40" y="180" width="12" height="12" rx="2" />
  </g>

  <!-- Routed traces: 90-degree copper lines across the board. -->
  <g fill="none" stroke="#E7A15E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 70 H132 V106 H204" stroke-opacity="0.85" />
    <path d="M52 186 H104 V148 H164" stroke-opacity="0.6" />
  </g>

  <!-- Vias where traces terminate. -->
  <g>
    <circle cx="204" cy="106" r="13" fill="none" stroke="#E7A15E" stroke-opacity="0.5" stroke-width="4" />
    <circle cx="204" cy="106" r="5" fill="#E7A15E" fill-opacity="0.9" />
    <circle cx="164" cy="148" r="11" fill="none" stroke="#E7A15E" stroke-opacity="0.4" stroke-width="4" />
    <circle cx="164" cy="148" r="4" fill="#E7A15E" fill-opacity="0.7" />
  </g>

  <!-- Status LED: the one red element on the board. -->
  <circle cx="196" cy="196" r="14" fill="#FF2A26" />
  <circle cx="196" cy="196" r="14" fill="none" stroke="#FF2A26" stroke-opacity="0.35" stroke-width="6" />
</svg>
